<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Crop GLB</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: #16181d;
        --line: #2c2f36;
        --accent: #4f9dff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #0b0c0f;
        color: #e6e8ec;
        overflow: hidden;
      }
      #stage { position: fixed; inset: 0; }
      canvas { display: block; }

      #panel {
        position: fixed;
        top: 16px;
        left: 16px;
        width: 268px;
        padding: 14px;
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        border: 1px solid var(--line);
        border-radius: 10px;
        backdrop-filter: blur(8px);
      }
      h1 { margin: 0 0 4px; font-size: 14px; }
      .muted { color: #8b909b; }
      .row { display: flex; gap: 6px; margin-top: 10px; }
      button {
        flex: 1;
        padding: 7px 9px;
        font: inherit;
        color: inherit;
        background: #23262d;
        border: 1px solid var(--line);
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: #4a4f59; }
      button:disabled { opacity: 0.45; cursor: default; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #05203f; font-weight: 600; }
      button.active { border-color: var(--accent); color: var(--accent); }
      label.check { display: flex; align-items: center; gap: 7px; margin-top: 10px; cursor: pointer; }
      .slider { margin-top: 12px; }
      .sliderTop { display: flex; justify-content: space-between; color: #8b909b; }
      #rotateValue { color: #e6e8ec; font-variant-numeric: tabular-nums; }
      input[type="range"] { width: 100%; margin: 4px 0 0; accent-color: var(--accent); }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 12px 0 0; }
      dt { color: #8b909b; }
      dd { margin: 0; font-variant-numeric: tabular-nums; }
      #status { margin-top: 10px; min-height: 18px; color: var(--accent); }
      #status.error { color: #ff7a6b; }
      #tilt { margin-top: 6px; min-height: 18px; }
      #tilt.warn { color: #ffc46b; }
      hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }

      #marquee {
        position: fixed;
        border: 1px solid var(--accent);
        background: rgba(79, 157, 255, 0.16);
        pointer-events: none;
        display: none;
      }
      #hint {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 7px 13px;
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: #8b909b;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="marquee"></div>

    <div id="panel">
      <h1>Crop GLB</h1>
      <div class="muted" id="model">loading…</div>

      <div class="row">
        <button id="draw" class="active">Draw box</button>
        <button id="orbit">Orbit</button>
      </div>
      <div class="row">
        <button id="top">Top view</button>
        <button id="clear" disabled>Clear box</button>
      </div>
      <div class="row">
        <button id="shrink" disabled>Shrink 1 m</button>
        <button id="grow" disabled>Grow 1 m</button>
      </div>

      <div class="slider">
        <div class="sliderTop">
          <span>Turn view</span>
          <span id="rotateValue">0°</span>
        </div>
        <input type="range" id="rotate" min="-180" max="180" step="1" value="0" />
      </div>

      <label class="check">
        <input type="checkbox" id="overlapping" />
        <span>Keep partly-covered triangles</span>
      </label>

      <dl id="readout"></dl>
      <div id="tilt" class="muted"></div>

      <hr />
      <div class="row">
        <button id="crop" class="primary" disabled>Crop</button>
      </div>
      <div class="row">
        <button id="download" disabled>Download .glb</button>
        <button id="reset" disabled>Original</button>
      </div>
      <div id="status"></div>
    </div>

    <div id="hint">Turn the view until the house is square to the screen, then left-drag a box · right-drag to orbit · [ ] to turn</div>

    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="/viewer.js"></script>
  </body>
</html>

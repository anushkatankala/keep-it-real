<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>142 Maple Street</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Inter:wght@300;400;500&display=swap");

      :root {
        color-scheme: dark;
        --canvas: #080808;
        --line: rgba(255, 255, 255, 0.08);
        --line-hover: rgba(255, 255, 255, 0.2);
        --muted: rgba(255, 255, 255, 0.36);
        --surface: rgba(8, 8, 8, 0.54);
        --text: rgba(255, 255, 255, 0.86);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font: 300 13px/1.5 "Inter", ui-sans-serif, system-ui, sans-serif;
        background: var(--canvas);
        color: var(--text);
        overflow: hidden;
      }

      #stage { position: fixed; inset: 0; }
      canvas { display: block; }

      .glass {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.06),
          0 24px 48px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
      }

      #title {
        position: fixed;
        top: 24px;
        left: 24px;
        max-width: 360px;
        padding: 15px 18px;
        animation: surface-in 450ms cubic-bezier(0.25, 0.1, 0.25, 1) 100ms both;
      }

      #house {
        color: rgba(255, 255, 255, 0.94);
        font: 600 16px/1 "Barlow Condensed", sans-serif;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      #where {
        margin-top: 6px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      #badge {
        display: inline-block;
        margin-top: 11px;
        padding: 4px 8px;
        color: rgba(255, 255, 255, 0.38);
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #stops {
        position: fixed;
        top: 24px;
        right: 24px;
        width: 220px;
        max-height: calc(100vh - 132px);
        padding: 9px;
        overflow: auto;
        animation: surface-in 450ms cubic-bezier(0.25, 0.1, 0.25, 1) 150ms both;
      }

      #stops button {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        padding: 8px 10px;
        color: rgba(255, 255, 255, 0.42);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 8px;
        cursor: pointer;
        font: 300 11px/1.3 "Inter", sans-serif;
        text-align: left;
        transition:
          background 150ms ease,
          border-color 150ms ease,
          color 150ms ease;
      }

      #stops button:hover {
        color: rgba(255, 255, 255, 0.78);
        background: rgba(255, 255, 255, 0.04);
        border-color: var(--line);
      }

      #stops button[aria-current="true"] {
        color: #080808;
        background: rgba(255, 255, 255, 0.9);
        border-color: rgba(255, 255, 255, 0.9);
        font-weight: 400;
      }

      #stops .len {
        font-variant-numeric: tabular-nums;
        opacity: 0.5;
      }

      #doors {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        max-width: calc(100vw - 48px);
        padding: 9px;
        overflow: auto;
        z-index: 4;
        animation: surface-in-centred 450ms cubic-bezier(0.25, 0.1, 0.25, 1) 200ms both;
      }

      #doors button {
        flex: none;
        padding: 8px 13px;
        color: rgba(255, 255, 255, 0.62);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        cursor: pointer;
        font: 300 10px/1 "Inter", sans-serif;
        letter-spacing: 0.06em;
        white-space: nowrap;
        transition: all 150ms ease;
      }

      #doors button:hover {
        color: rgba(255, 255, 255, 0.92);
        background: rgba(255, 255, 255, 0.09);
        border-color: var(--line-hover);
      }

      #caption {
        position: fixed;
        left: 50%;
        bottom: 106px;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0 7px;
        width: min(860px, calc(100vw - 96px));
        padding: 0 8px;
        font-size: 18px;
        font-weight: 300;
        line-height: 1.55;
        text-align: center;
        text-shadow: 0 2px 16px rgba(0, 0, 0, 0.92);
        pointer-events: none;
      }

      #caption span {
        color: rgba(255, 255, 255, 0.28);
        transition: color 120ms linear;
      }

      #caption span.spoken { color: rgba(255, 255, 255, 0.72); }
      #caption span.speaking { color: rgba(255, 255, 255, 0.98); }

      #controls {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        width: min(720px, calc(100vw - 36px));
        animation: surface-in-centred 450ms cubic-bezier(0.25, 0.1, 0.25, 1) 200ms both;
      }

      #controls button {
        flex: none;
        display: grid;
        width: 32px;
        height: 32px;
        padding: 0;
        color: rgba(255, 255, 255, 0.62);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        cursor: pointer;
        place-items: center;
        font: 400 13px/1 "Inter", sans-serif;
        transition: all 150ms ease;
      }

      #controls button:hover {
        color: rgba(255, 255, 255, 0.92);
        background: rgba(255, 255, 255, 0.1);
        border-color: var(--line-hover);
      }

      #play {
        color: #080808;
        background: rgba(255, 255, 255, 0.92);
        border-color: rgba(255, 255, 255, 0.92);
        font-weight: 500;
      }

      #play:hover {
        color: #080808;
        background: rgba(255, 255, 255, 0.8);
        border-color: rgba(255, 255, 255, 0.8);
      }

      #track {
        position: relative;
        flex: 1;
        height: 2px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        cursor: default;
      }

      #fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        background: rgba(255, 255, 255, 0.82);
      }

      #clock {
        flex: none;
        color: var(--muted);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
      }

      #intro {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(8, 8, 8, 0.72);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        z-index: 10;
      }

      #intro > div {
        width: min(440px, calc(100vw - 48px));
        padding: 30px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.06),
          0 24px 48px rgba(0, 0, 0, 0.4);
        animation: intro-in 500ms cubic-bezier(0.25, 0.1, 0.25, 1) both;
      }

      #intro h1 {
        margin: 0 0 10px;
        color: rgba(255, 255, 255, 0.94);
        font: 600 25px/1.1 "Barlow Condensed", sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #intro p {
        margin: 0 0 22px;
        color: rgba(255, 255, 255, 0.42);
        font-size: 12px;
        font-weight: 300;
        line-height: 1.7;
      }

      #begin {
        padding: 11px 18px;
        color: rgba(255, 255, 255, 0.72);
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        cursor: pointer;
        font: 400 10px/1 "Inter", sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        transition: all 150ms ease;
      }

      #begin:hover {
        color: rgba(255, 255, 255, 0.95);
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.4);
      }

      #error {
        color: rgba(255, 255, 255, 0.62);
      }

      @keyframes surface-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes surface-in-centred {
        from { opacity: 0; transform: translate(-50%, 8px); }
        to { opacity: 1; transform: translate(-50%, 0); }
      }

      @keyframes intro-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 720px) {
        #title {
          top: 16px;
          left: 16px;
          max-width: calc(100vw - 32px);
        }

        #stops {
          top: auto;
          right: 16px;
          bottom: 76px;
          left: 16px;
          display: flex;
          width: auto;
          max-height: none;
          overflow-x: auto;
        }

        #stops button {
          flex: none;
          width: auto;
        }

        #stops .len { display: none; }
        #caption { bottom: 98px; width: calc(100vw - 32px); font-size: 15px; }
        #controls { bottom: 16px; width: calc(100vw - 32px); }
        .mode-walk #doors { bottom: 16px; }
      }

      @media (prefers-reduced-motion: reduce) {
        #title,
        #stops,
        #controls,
        #doors,
        #intro > div {
          animation: none;
        }
      }

      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="stage"></div>

    <div id="title" class="glass">
      <div id="house">Loading…</div>
      <div id="where"></div>
      <div id="badge" class="hidden"></div>
    </div>

    <nav id="stops" class="glass"></nav>

    <div id="caption"></div>
    <nav id="doors" class="glass hidden"></nav>

    <div id="controls" class="glass">
      <button id="prev" title="Previous stop">&#8249;</button>
      <button id="play" title="Play or pause (space)">&#9654;</button>
      <button id="next" title="Next stop">&#8250;</button>
      <div id="track"><div id="fill"></div></div>
      <div id="clock">0:00</div>
      <button id="restart" title="Start again">&#8634;</button>
    </div>

    <div id="intro">
      <div>
        <h1 id="introTitle">AI tour</h1>
        <p id="introText">Preparing…</p>
        <button id="begin" class="hidden">Begin</button>
        <p id="error"></p>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="/tour.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tour</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: #16181d;
        --line: #2c2f36;
        --accent: #4f9dff;
        --muted: #8b909b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #0b0c0f;
        color: #e6e8ec;
        overflow: hidden;
      }
      #stage { position: fixed; inset: 0; }
      canvas { display: block; }

      .glass {
        background: color-mix(in srgb, var(--panel) 90%, transparent);
        border: 1px solid var(--line);
        border-radius: 10px;
        backdrop-filter: blur(10px);
      }

      /* ---------------------------------------------------------- title */

      #title {
        position: fixed;
        top: 18px;
        left: 18px;
        padding: 12px 16px;
        max-width: 340px;
      }
      #house { font-size: 15px; font-weight: 650; }
      #where { color: var(--muted); margin-top: 2px; }
      #badge {
        display: inline-block;
        margin-top: 8px;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        letter-spacing: 0.02em;
        color: #ffcf8b;
        background: rgba(255, 190, 100, 0.12);
        border: 1px solid rgba(255, 190, 100, 0.25);
      }

      /* ----------------------------------------------------------- stops */

      #stops {
        position: fixed;
        top: 18px;
        right: 18px;
        width: 208px;
        padding: 8px;
        max-height: calc(100vh - 150px);
        overflow: auto;
      }
      #stops button {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        padding: 6px 9px;
        font: inherit;
        text-align: left;
        color: var(--muted);
        background: none;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      #stops button:hover { background: #20232a; color: #e6e8ec; }
      #stops button[aria-current="true"] { background: #20232a; color: var(--accent); font-weight: 600; }
      #stops .len { font-variant-numeric: tabular-nums; opacity: 0.6; }

      #doors {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        padding: 8px;
        max-width: calc(100vw - 36px);
        overflow: auto;
        z-index: 4;
      }
      #doors button {
        flex: none;
        padding: 8px 12px;
        font: inherit;
        color: #e6e8ec;
        background: #23262d;
        border: 1px solid var(--line);
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
      }
      #doors button:hover { border-color: var(--accent); color: white; }

      /* -------------------------------------------------------- captions */

      #caption {
        position: fixed;
        left: 50%;
        bottom: 104px;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0 7px;
        width: min(860px, calc(100vw - 96px));
        padding: 0 8px;
        font-size: 19px;
        line-height: 1.55;
        text-align: center;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
        pointer-events: none;
      }
      #caption span { color: rgba(230, 232, 236, 0.34); transition: color 120ms linear; }
      #caption span.spoken { color: rgba(230, 232, 236, 0.85); }
      #caption span.speaking { color: #ffffff; }

      /* -------------------------------------------------------- controls */

      #controls {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        width: min(720px, calc(100vw - 36px));
      }
      #controls button {
        flex: none;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        font: inherit;
        font-size: 14px;
        color: inherit;
        background: #23262d;
        border: 1px solid var(--line);
        border-radius: 8px;
        cursor: pointer;
      }
      #controls button:hover { border-color: #4a4f59; }
      #play { background: var(--accent); border-color: var(--accent); color: #05203f; font-weight: 700; }
      #track {
        position: relative;
        flex: 1;
        height: 5px;
        border-radius: 99px;
        background: #2b2f37;
        overflow: hidden;
        cursor: default;
      }
      #fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); }
      #clock { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }

      /* ----------------------------------------------------------- intro */

      /* Not "opener": an element with that id would collide with window.opener
         when poking at the page from a console. */
      #intro {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(6, 7, 10, 0.82);
        backdrop-filter: blur(3px);
        z-index: 10;
      }
      #intro > div { text-align: center; max-width: 420px; padding: 0 24px; }
      #intro h1 { margin: 0 0 6px; font-size: 26px; font-weight: 650; }
      #intro p { margin: 0 0 20px; color: var(--muted); }
      #begin {
        padding: 11px 26px;
        font: inherit;
        font-size: 14px;
        font-weight: 650;
        color: #05203f;
        background: var(--accent);
        border: 0;
        border-radius: 9px;
        cursor: pointer;
      }
      #error { color: #ff7a6b; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="stage"></div>

    <div id="title" class="glass">
      <div id="house">Loading…</div>
      <div id="where"></div>
      <div id="badge" class="hidden"></div>
    </div>

    <nav id="stops" class="glass"></nav>

    <div id="caption"></div>
    <nav id="doors" class="glass hidden"></nav>

    <div id="controls" class="glass">
      <button id="prev" title="Previous stop">&#9664;&#9664;</button>
      <button id="play" title="Play or pause (space)">&#9654;</button>
      <button id="next" title="Next stop">&#9654;&#9654;</button>
      <div id="track"><div id="fill"></div></div>
      <div id="clock">0:00</div>
      <button id="restart" title="Start again">&#8635;</button>
    </div>

    <div id="intro">
      <div>
        <h1 id="introTitle">AI tour</h1>
        <p id="introText">Preparing…</p>
        <button id="begin" class="hidden">Play tour</button>
        <p id="error"></p>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="/tour.js"></script>
  </body>
</html>
